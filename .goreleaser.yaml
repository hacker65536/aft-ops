# GoReleaser configuration (schema v2).
# Docs: https://goreleaser.com
version: 2

project_name: aft-ops

before:
  hooks:
    - go mod tidy

builds:
  - id: aft-ops
    main: ./cmd/aft-ops
    binary: aft-ops
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hacker65536/aft-ops/internal/cli.version={{ .Version }}
      - -X github.com/hacker65536/aft-ops/internal/cli.commit={{ .Commit }}
      - -X github.com/hacker65536/aft-ops/internal/cli.date={{ .Date }}

archives:
  - id: aft-ops
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto

# Homebrew tap. `brews` (formula) is deprecated in GoReleaser v2; casks are the
# current path for shipping prebuilt binaries.
homebrew_casks:
  - name: aft-ops
    repository:
      owner: hacker65536
      name: homebrew-tap
      # A PAT with write access to the tap; the workflow's default GITHUB_TOKEN
      # is scoped to this repository and cannot push to another one.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    homepage: https://github.com/hacker65536/aft-ops
    description: Operate AWS Control Tower AFT customizations pipelines at scale
    # Prereleases (see release.prerelease above) do not update the tap.
    skip_upload: auto
    # The binary is neither signed nor notarized, so Gatekeeper would flag it as
    # "damaged" on first run; strip the quarantine bit after staging.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aft-ops"]
          end
